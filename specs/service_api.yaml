      tags:
        - firewalls
  /v1/firewalls/{id}/disassociate:
    post:
      operationId: disassociateFirewall
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                instances:
                  $ref: '#/components/schemas/UuidList'
                instanceType:
                  default: baremetal
                  enum:
                    - baremetal
                    - container
                  type: string
              required:
