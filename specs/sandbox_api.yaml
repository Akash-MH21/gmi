        created_at:
          type: string
          format: date-time
          description: Template creation time in UTC.
        updated_at:
          type: string
          format: date-time
          description: Template update time in UTC.
    TemplateBuild:
      type: object
      additionalProperties: false
      required:
      - id
      - template_id
      - trigger
      - status
      - artifact_state
      - source_type
      - resources
      - created_at
      properties:
        id:
          type: string
          description: Immutable Build identifier.
        template_id:
          type: string
          description: Owning Template identifier.
        trigger:
          $ref: '#/components/schemas/BuildTrigger'
        status:
          $ref: '#/components/schemas/BuildStatus'
        artifact_state:
          $ref: '#/components/schemas/ArtifactState'
        source_type:
          $ref: '#/components/schemas/BuildSourceType'
