            current successful Build is used.

            '
    UpdateSandboxControlRequest:
      type: object
      required:
      - metadata
      properties:
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Customer metadata, replaced as a whole.
    UpdateTemplateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 'Mutable Template metadata patch. Omitted fields are left unchanged;

        `labels` replaces the stored map wholesale when provided.

        '
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: New organization-scoped display name.
        description:
          type: string
          maxLength: 256
          description: New human-readable description.
        labels:
          type: object
          maxProperties: 64
          description: Complete replacement of user-defined labels.
          additionalProperties:
            type: string
            maxLength: 256
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API Key or Access Token, always sent as `Authorization: Bearer <token>`. The gateway
        recognizes the token type automatically.

        '
    sandboxAccessToken:
      type: apiKey
      in: header
      name: X-Access-Token
      description: 'Sandbox data-plane token — the `sandbox_access_token` returned by the create/connect
        endpoints. Used for `/files`, Sandbox-Exec, and other data-plane endpoints; the control plane
        (`/api/v2`) does not accept it, and conversely the control plane''s `Authorization: Bearer` is
        invalid on the data plane.


        The token is bound to its sandbox: using sandbox A''s token against sandbox B''s host fails. It
        stays valid until the sandbox''s lifetime ends; there is no separate rotation endpoint (`rotate_traffic_token`
        rotates the port traffic token `traffic_access_token` and does not affect this one).

        '
