<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">gmi, the community command line for GMI Cloud</title>
  <desc id="d">The word gmi in large green letters beside a terminal prompt, with the tagline: chat with any model on GMI Cloud from your terminal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E11"/>
      <stop offset="1" stop-color="#0f2219"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#3cbec8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#1FA97A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1FA97A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="19.5" fill="none" stroke="#252B33"/>

  <g transform="translate(46 40)">
    <circle cx="0" cy="0" r="7" fill="#ff5f57"/>
    <circle cx="24" cy="0" r="7" fill="#febc2e"/>
    <circle cx="48" cy="0" r="7" fill="#28c840"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="64" y="196" font-size="150" font-weight="700" fill="url(#ac)" letter-spacing="-4">gmi</text>
    <text x="64" y="262" font-size="27" fill="#E9EDF2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The community command line for GMI Cloud</text>
    <text x="64" y="296" font-size="19" fill="#8B97A6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Chat with any model, switch mid-conversation, script it with JSON.</text>

    <g transform="translate(700 92)">
      <rect width="520" height="190" rx="12" fill="#0E1216" stroke="#252B33"/>
      <text x="24" y="44" font-size="20" fill="#8B97A6">gmi 0.1.0 | openai/gpt-6.1-sol</text>
      <text x="24" y="86" font-size="23" fill="#3cbec8" font-weight="700">gmi&gt;</text>
      <text x="92" y="86" font-size="23" fill="#E9EDF2">/model</text>
      <rect x="24" y="104" width="472" height="34" rx="6" fill="#E9EDF2"/>
      <text x="36" y="128" font-size="19" fill="#0B0E11">* openai/gpt-6.1-sol</text>
      <text x="276" y="128" font-size="15" fill="#374151">1.05M ctx  $2 / $10</text>
      <text x="24" y="170" font-size="23" fill="#3cbec8" font-weight="700">gmi&gt;</text>
      <rect x="92" y="152" width="13" height="24" fill="#34d399">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
